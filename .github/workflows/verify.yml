name: Verify static export

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build static site
        run: npm run build
      - name: Verify generated files
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/guides/index.html
          test -f out/privacy-policy/index.html
          test -f out/terms-of-use/index.html
          test -f out/disclaimer/index.html
          test -f out/how-to-calculate-cubic-yards/index.html
          test -f out/what-is-a-cubic-yard/index.html
          test -f out/cubic-yard-coverage-chart/index.html
